<!doctype html>
<!-- VGU Sport Week 2026 chess: the one fixed link. Finds the stream laptop's current address and goes there. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>VGU Chess</title>
<style>
  :root{--bg:#f4f1ef;--ink:#1d1b1a;--mut:#6b6461;--acc:#97605e}
  @media (prefers-color-scheme:dark){:root{--bg:#151312;--ink:#eee;--mut:#a39d9a;--acc:#e0a39f}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:18px/1.5 "Segoe UI",system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  h1{font-size:28px;margin:0 0 8px} p{margin:0;color:var(--mut)} button{margin-top:18px;font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
  .spin{width:34px;height:34px;border:4px solid #8884;border-top-color:var(--acc);border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite} @keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div>
  <div class="spin" id="spin"></div>
  <h1>♟ VGU Chess</h1>
  <p id="msg">Opening…</p>
  <button id="again" hidden onclick="go()">Try again</button>
</div>
<script>
const GIST = 'd1690e1530b9c072c4dd9b2dea25b8f0';
// This device's memory (random, kept in this browser): an approved device gets back in by itself after the stream laptop's
// tunnel restarts. Ryan's admin key, once opened here, is remembered too, so on his phone the plain link opens the admin page.
const store = (k, v) => { try { if (v !== undefined) localStorage.setItem(k, v); return localStorage.getItem(k); } catch { return v || ''; } };
let dev = store('vguDev'); if (!dev) dev = store('vguDev', Array.from(crypto.getRandomValues(new Uint8Array(24)), b => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'[b & 63]).join(''));
const given = (location.hash.match(/admin=([A-Za-z0-9_-]+)/) || [])[1];
if (given) { store('vguAdmin', given); history.replaceState(null, '', location.pathname); }   // the key never stays in the address bar
const admin = given || store('vguAdmin');
// Finds the stream laptop's current address and only goes there once it answers (after a restart the old address is dead
// for a few seconds until the new one is published): keeps trying for 2 minutes.
async function go() {
  const $ = id => document.getElementById(id), t0 = Date.now();
  $('again').hidden = true; $('spin').hidden = false; $('msg').textContent = 'Opening…';
  while (Date.now() - t0 < 120000) {
    try {
      const g = await fetch(`https://api.github.com/gists/${GIST}?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json());
      const url = String(g.files?.['tunnel.txt']?.content || '').trim();
      if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) {
        const alive = await fetch(url + '/alive', { cache: 'no-store', signal: AbortSignal.timeout(6000) }).then(r => r.ok, () => false);
        if (alive) return location.replace(admin ? `${url}/admin?k=${encodeURIComponent(admin)}` : `${url}/#dev=${dev}`);
      }
    } catch {}
    if (Date.now() - t0 > 4000) $('msg').textContent = 'Reconnecting to the stream laptop…';
    await new Promise(r => setTimeout(r, 3000));
  }
  $('spin').hidden = true; $('again').hidden = false;
  $('msg').textContent = 'The stream laptop is not online right now. Try again in a minute, or call Ryan.';
}
go();
</script>
</body></html>
