<!doctype html>
<!-- VGU Sport Week 2026 chess: the one fixed link. Finds the stream laptop's current address and goes there. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>VGU Chess</title>
<style>
  :root{--bg:#f4f1ef;--ink:#1d1b1a;--mut:#6b6461;--acc:#97605e}
  @media (prefers-color-scheme:dark){:root{--bg:#151312;--ink:#eee;--mut:#a39d9a;--acc:#e0a39f}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:18px/1.5 "Segoe UI",system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  h1{font-size:28px;margin:0 0 8px} p{margin:0;color:var(--mut)} button{margin-top:18px;font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
  .spin{width:34px;height:34px;border:4px solid #8884;border-top-color:var(--acc);border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite} @keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div>
  <div class="spin" id="spin"></div>
  <h1>♟ VGU Chess</h1>
  <p id="msg">Opening…</p>
  <button id="again" hidden onclick="go()">Try again</button>
</div>
<script>
const GIST = 'd1690e1530b9c072c4dd9b2dea25b8f0';
const admin = (location.hash.match(/admin=([A-Za-z0-9_-]+)/) || [])[1];
if (admin) history.replaceState(null, '', location.pathname);   // the admin token never stays in the address bar
async function go() {
  document.getElementById('again').hidden = true; document.getElementById('spin').hidden = false; document.getElementById('msg').textContent = 'Opening…';
  try {
    const g = await fetch(`https://api.github.com/gists/${GIST}?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json());
    const url = String(g.files?.['tunnel.txt']?.content || '').trim();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw new Error('off');
    location.replace(admin ? `${url}/admin?k=${encodeURIComponent(admin)}` : url + '/');
  } catch {
    document.getElementById('spin').hidden = true; document.getElementById('again').hidden = false;
    document.getElementById('msg').textContent = 'The stream laptop is not online right now. Try again in a minute, or call Ryan.';
  }
}
go();
</script>
</body></html>
